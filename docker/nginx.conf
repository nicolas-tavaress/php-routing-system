server {
    listen 80;
    server_name localhost;

    # Inside Docker the project is mounted at /var/www/html; adjust root for a local nginx.
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        # Docker: "php:9000". Local php8.5-fpm: "unix:/run/php/php8.5-fpm.sock".
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
